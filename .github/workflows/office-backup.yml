# The nightly backup of the office objects (Supabase exit, wave 4; spec section 2, "Backups" (2); Madar enterprises, design 5.15). It runs
# at 02:07 Riyadh, off the busy start of the hour and between two runs of the 15-minute Cron of the office object (02:00 and 02:15).
#
# Each enterprise has its own office object, so each one has its own backup. The step "List the enterprises" asks the Worker for the ids
# (scripts/backup/officeEnterprises.ts). scripts/backup/officeExport.ts then asks the export route of the copy (vars.OFFICE_BACKUP_URL) for
# every row of one enterprise, with the secret header. The office object refuses writes for at most 5 minutes meanwhile; reads and
# sign-ins go on. The script encrypts the folder with age to the owner's public key, and each file goes to its own release of the private
# repository madar-backups, named madar-office-<copy>-<ent>-<stamp>. Releases of the same copy older than 30 days go.
#
# One enterprise that fails does not stop the others: the export goes on to the next id, and the run fails at the end. So GitHub mails the
# owner when an export fails twice, when an upload fails, or when the newest backup of any enterprise before this run was older than 26
# hours. A new enterprise with no backup yet counts as 0 hours. Until vars.OFFICE_BACKUP_URL is set (wave 5), every run ends at its first
# step.
#
# Values, by name only:
#   secrets.OFFICE_EXPORT_SECRET  the MADAR_EXPORT_SECRET of the Worker of that copy (scripts/office/new-secret.ts --github)
#   secrets.BACKUP_REPO_TOKEN     a fine-grained token with "contents: write" on madar-backups only (the DB backup uses it too)
#   vars.OFFICE_BACKUP_URL        the page address of the copy, for example https://preview.madar-46r.pages.dev
#   vars.OFFICE_BACKUP_COPY       test or production
#   vars.BACKUP_AGE_RECIPIENT     the owner's age public key (age1...); not a secret
name: Office backup

on:
  schedule:
    - cron: '7 2 * * *'
      timezone: 'Asia/Riyadh'
  workflow_dispatch:

concurrency:
  group: office-backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.1'
  BACKUP_REPO: byosamah/madar-backups
  KEEP_DAYS: '30'
  STALE_HOURS: '26'
  # VADOs' Companies. Its backups from before the enterprise names (madar-office-<copy>-<stamp>) count as its own in the age check.
  VADO_ENT: ent_001

jobs:
  backup:
    name: backup
    # A fork or a copy of the repository has no backup to make.
    if: github.repository == 'byosamah/madar'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Is the office backup on
        id: on
        env:
          URL: ${{ vars.OFFICE_BACKUP_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "The office backup is off: vars.OFFICE_BACKUP_URL is not set (wave 5 of the exit plan sets it)."
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi

      # No step uses git after the checkout, so the job token does not stay in .git/config for install scripts to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.on.outputs.on == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.on.outputs.on == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # npm ci runs before any step gets a secret, so no install script can read one.
      - run: npm ci
        if: steps.on.outputs.on == 'true'
      - name: Install age
        if: steps.on.outputs.on == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q age

      - name: List the enterprises
        id: ents
        if: steps.on.outputs.on == 'true'
        env:
          OFFICE_EXPORT_SECRET: ${{ secrets.OFFICE_EXPORT_SECRET }}
          URL: ${{ vars.OFFICE_BACKUP_URL }}
        run: |
          npx tsx scripts/backup/officeEnterprises.ts --url "$URL" > "$RUNNER_TEMP/enterprises.json"
          cat "$RUNNER_TEMP/enterprises.json"
          echo "ids=$(jq -r '.enterprises | join(" ")' "$RUNNER_TEMP/enterprises.json")" >> "$GITHUB_OUTPUT"

      # The newest backup of each enterprise, from one list of the releases. hours is the largest age: the step that fails the run reads it.
      - name: Age of the newest office backup
        id: fresh
        if: steps.on.outputs.on == 'true'
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          COPY: ${{ vars.OFFICE_BACKUP_COPY }}
          IDS: ${{ steps.ents.outputs.ids }}
        run: |
          releases="$(gh release list --repo "$BACKUP_REPO" --limit 1000 --json tagName,publishedAt)"
          worst=0
          for ENT in $IDS; do
            newest="$(printf '%s' "$releases" | jq -r \
              "[.[] | select(.tagName | startswith(\"madar-office-$COPY-$ENT-\") or (\"$ENT\" == \"$VADO_ENT\" and test(\"^madar-office-$COPY-[0-9]{8}-\")))] | sort_by(.publishedAt) | last | .publishedAt // empty")"
            if [ -z "$newest" ]; then
              echo "No office backup of $ENT yet."
              continue
            fi
            hours=$(( ($(date -u +%s) - $(date -u -d "$newest" +%s)) / 3600 ))
            echo "The newest office backup of $ENT is $hours hours old."
            if [ "$hours" -gt "$worst" ]; then worst="$hours"; fi
          done
          echo "hours=$worst" >> "$GITHUB_OUTPUT"

      # One enterprise after the other. A failed export waits 2 minutes and tries once more; an enterprise that fails twice goes on the list
      # of the failed ones and the loop goes on with the next id. The step ends with success, so the upload of the others still runs.
      - name: Export, count and encrypt
        id: dump
        if: steps.on.outputs.on == 'true'
        env:
          OFFICE_EXPORT_SECRET: ${{ secrets.OFFICE_EXPORT_SECRET }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          URL: ${{ vars.OFFICE_BACKUP_URL }}
          COPY: ${{ vars.OFFICE_BACKUP_COPY }}
          IDS: ${{ steps.ents.outputs.ids }}
        run: |
          mkdir -p "$RUNNER_TEMP/backup"
          : > "$RUNNER_TEMP/backup/results.tsv"
          failed=""
          for ENT in $IDS; do
            result="$RUNNER_TEMP/backup/$ENT.json"
            # A write during the export (rare at 02:07) or a dropped connection fails one run: try once more after 2 minutes.
            if ! npx tsx scripts/backup/officeExport.ts --url "$URL" --copy "$COPY" --enterprise "$ENT" --out "$RUNNER_TEMP/backup" > "$result"; then
              sleep 120
              if ! npx tsx scripts/backup/officeExport.ts --url "$URL" --copy "$COPY" --enterprise "$ENT" --out "$RUNNER_TEMP/backup" > "$result"; then
                echo "::error::The export of $ENT failed twice."
                failed="$failed $ENT"
                continue
              fi
            fi
            cat "$result"
            printf '%s\t%s\t%s\n' "$ENT" "$(jq -r .file "$result")" "$(jq -r .name "$result")" >> "$RUNNER_TEMP/backup/results.tsv"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"

      - name: Upload to madar-backups
        id: upload
        if: steps.on.outputs.on == 'true'
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          failed=""
          while IFS="$(printf '\t')" read -r ENT file name; do
            if ! gh release create "$name" "$file" --repo "$BACKUP_REPO" --title "$name" \
              --notes "Nightly backup of an office object of Madar, encrypted with age to the owner's key. Check it with scripts/restore-check.ts."; then
              echo "::error::The upload of the backup of $ENT failed."
              failed="$failed $ENT"
            fi
          done < "$RUNNER_TEMP/backup/results.tsv"
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"

      # Only after the uploads, so a run of failures never removes the last good backups. The shell puts the copy into the
      # jq text (startswith("madar-office-test-")), so a run of the test copy never removes a production backup.
      - name: Remove office backups older than 30 days
        if: steps.on.outputs.on == 'true'
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          COPY: ${{ vars.OFFICE_BACKUP_COPY }}
        run: |
          cutoff="$(date -u -d "$KEEP_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)"
          copy="$COPY"
          gh release list --repo "$BACKUP_REPO" --limit 1000 --json tagName,publishedAt \
            --jq ".[] | select(.publishedAt < \"$cutoff\") | select(.tagName | startswith(\"madar-office-${copy}-\")) | .tagName" |
            while read -r tag; do
              echo "Remove $tag"
              gh release delete "$tag" --repo "$BACKUP_REPO" --yes --cleanup-tag
            done

      - name: Fail when the office backup before this one was older than 26 hours
        # The || '0' keeps fromJSON off an empty text: the step of the age is skipped while the backup is off.
        if: steps.on.outputs.on == 'true' && fromJSON(steps.fresh.outputs.hours || '0') > fromJSON(env.STALE_HOURS)
        env:
          HOURS: ${{ steps.fresh.outputs.hours }}
        run: |
          echo "::error::The newest office backup before this run was $HOURS hours old (the limit is $STALE_HOURS). A night had no backup."
          exit 1

      # The last step: an enterprise that has no new backup tonight fails the run, so GitHub mails the owner. The others already have theirs.
      - name: Fail when an enterprise has no backup tonight
        if: steps.on.outputs.on == 'true' && always() && (steps.dump.outputs.failed != '' || steps.upload.outputs.failed != '')
        env:
          EXPORT_FAILED: ${{ steps.dump.outputs.failed }}
          UPLOAD_FAILED: ${{ steps.upload.outputs.failed }}
        run: |
          echo "::error::No backup tonight for: ${EXPORT_FAILED} ${UPLOAD_FAILED}"
          exit 1
