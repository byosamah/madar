# Deploy of the test project madar-test (plan 5.9, task O3): migrations, functions and screens, by hand only.
# Production never deploys from GitHub. scripts/deploy/all.sh production runs on the Mac after the typed word (plan, section 10,
# decision 9), and every deploy script refuses production when CI or GITHUB_ACTIONS is set.
# Settings (config.sh) and secrets (secrets.ts) also run only from the Mac: they need secrets/test.env, which never goes to GitHub.
#
# Repository secrets, each only in the step that needs it, never during npm ci:
#   TEST_SUPABASE_ACCESS_TOKEN  a Supabase access token. Caution: a token reaches every project of its account, production too.
#                               The scripts refuse production in CI, but the token itself does not. Revoke it if it may have leaked.
#   TEST_DB_PASSWORD            the postgres password of madar-test
#   TEST_CLOUDFLARE_API_TOKEN   a Cloudflare token for Pages deploys (account scope, Pages edit)
# Repository variables: MADAR_FILE_STORE (supabase or r2, default supabase) and R2_ACCOUNT_ID, for the hosts of dist/_headers.
name: Deploy test

on:
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.1'

jobs:
  deploy-test:
    name: deploy test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.TEST_SUPABASE_ACCESS_TOKEN }}
          MADAR_TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        run: scripts/deploy/db.sh test
      - name: Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.TEST_SUPABASE_ACCESS_TOKEN }}
        run: scripts/deploy/functions.sh test
      - name: Screens
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TEST_CLOUDFLARE_API_TOKEN }}
          MADAR_FILE_STORE: ${{ vars.MADAR_FILE_STORE }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
        run: scripts/deploy/pages.sh test
