# The Cloudflare Workers entry of the Madar server (owner, 2026-10-16: the server host of each copy, config/server-host.json).
# The top level is for local runs only (`npm run start:server`, `server/it/worker.it.test.ts`): `wrangler dev` on the Mac against
# the local stack, with no --env.
# [env.test] and [env.production] are the Workers of the two copies. Wrangler deploys them as madar-server-test and
# madar-server-production (`scripts/deploy/worker.sh <env>`). Bindings and vars do not inherit: each env repeats them.
# No env has a public address: the Pages Functions of the page host reach each Worker through a service binding
# (server/http/pagesApiProxy.ts, server/http/pagesMcpProxy.ts).
# Secrets: never in this file, never in git. `scripts/deploy/secrets.ts` sends them with `wrangler secret bulk`; local runs pass
# them with `--env-file`. The names are in server/core/deps.ts. A deploy resets the vars to this file and keeps the secrets.
name = "madar-server"
main = "dist-server/worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[dev]
ip = "127.0.0.1"
port = 8787

# The office object (Supabase exit, wave 3): one SQLite Durable Object for each enterprise (server/office/office.ts). The Worker uses it
# only with the var MADAR_DATA = "office" (server/entries/officeEntry.ts). No env sets that var in this file: scripts/deploy/worker.sh
# sets it from the host word of config/server-host.json. Bindings do not inherit, so [env.test] and [env.production] repeat the binding.
# The migrations also repeat in [env.production] (plan E), so the objects exist before the switch.
[[durable_objects.bindings]]
name = "OFFICE"
class_name = "Office"

[[migrations]]
tag = "office-v1"
new_sqlite_classes = ["Office"]

# The platform object of Madar enterprises (server/enterprise/platform/object.ts): the list of enterprises, the email directory, the owners
# and the meters. One object named "platform". Like OFFICE, the binding is repeated in [env.test] and [env.production].
[[durable_objects.bindings]]
name = "PLATFORM"
class_name = "Platform"

[[migrations]]
tag = "platform-v1"
new_sqlite_classes = ["Platform"]

# The 15-minute job of the office object (wave 3), in UTC. scheduled() returns at once while MADAR_DATA is not "office", so a Worker
# with the word supabase or workers does nothing. It takes 1 of the 5 Cron Triggers of the account (Workers Free) for each Worker.
[triggers]
crons = ["*/15 * * * *"]

# The database (proof.md, Z0a item 7): the Workers socket cannot check the private Supabase root, so the Worker connects through
# Hyperdrive, which checks it (verify-full) and gives the Worker a finished connection string (server/entries/worker.ts).
# Local runs set CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_DB to the local pooler, so no password is in this file. The id of
# the top level is a placeholder: only the envs below deploy.
[[hyperdrive]]
binding = "DB"
id = "00000000000000000000000000000000"

# The Worker of the test copy (madar-test, qdgwpnesxppnqsaabqzd).
[env.test]
workers_dev = false
preview_urls = false

# Run next to the database (Supabase in AWS eu-central-1): the probe ran in FRA, also through a service binding.
[env.test.placement]
region = "aws:eu-central-1"

# madar-db-test: the session pooler of madar-test (port 5432), verify-full with the CA supabase-root-2021-ca, caching off,
# origin connection limit 10 (proof.md, "Hyperdrive probe on madar-test (2026-10-16)"). Never the transaction pooler: it hangs.
[[env.test.hyperdrive]]
binding = "DB"
id = "1c4fc4b830234fad8956b6e80c52f4fc"

# The office object of the test copy (wave 3). It holds nothing until wave 5 moves the test copy to it.
[[env.test.durable_objects.bindings]]
name = "OFFICE"
class_name = "Office"

[[env.test.durable_objects.bindings]]
name = "PLATFORM"
class_name = "Platform"

# The Cron fan-out of Madar enterprises (spike S1, server/enterprise/fanout.ts): this Worker calls itself once for each enterprise, so
# each job has its own budget of outside calls. The binding names the Worker of this env.
[[env.test.services]]
binding = "SELF"
service = "madar-server-test"

# Public values. WORKER_REGION is the region label (server/core/deps.ts): no AWS region name, so no MCP region hop starts.
[env.test.vars]
SUPABASE_URL = "https://qdgwpnesxppnqsaabqzd.supabase.co"
WORKER_REGION = "workers-eu-central-1"
# The test tools of the office object (exit wave 4): the replace mode of the import (the seed) and the peek route of the deploy
# suite, both behind MADAR_OPS_SECRET. Never on production: server/office/ops.ts refuses them on a production copy anyway.
MADAR_TEST_TOOLS = "on"
# How the Cron sends one leg for each enterprise (server/enterprise/fanout.ts): "self" (the binding SELF) or "api" (the public API address).
# The default of the code is "self". The lead sets this var from the result of the spike S1 (proof.md, "S1: Cron fan-out").
MADAR_CRON_TRANSPORT = "self"
# The day cap of the test copy (owner decision 6, form A: the same account as production): 50% of each Free day limit, so a heavy
# test day cannot stop production. It acts only on the office path (config/server-host.json test: office).
MADAR_DAY_CAP = "rows_written=50000,rows_read=2500000,requests=50000"

# The Worker logs (npx wrangler tail madar-server-test, or the dashboard).
[env.test.observability]
enabled = true

# The Worker of production (madar, oprkvdjudjxxhvodkzgs).
[env.production]
workers_dev = false
preview_urls = false
# The objects exist in production since plan E, so the import and the directory can fill them before the switch. The migrations repeat
# here, because production holds no object before this deploy.
[[env.production.migrations]]
tag = "office-v1"
new_sqlite_classes = ["Office"]

[[env.production.migrations]]
tag = "platform-v1"
new_sqlite_classes = ["Platform"]

# The Cron is in place, and it stays inert: scheduled() returns at once unless MADAR_DATA is "office" (server/entries/workerMain.ts), and
# only worker.sh sets that var, from the host word. While production is supabase, the Supabase jobs function runs the job alone.
[env.production.triggers]
crons = ["*/15 * * * *"]

[env.production.placement]
region = "aws:eu-central-1"

# madar-db-production: the session pooler of madar (port 5432), made like madar-db-test by
# `npx tsx scripts/deploy/cloudflare-setup.ts --env production` (2026-10-16).
[[env.production.hyperdrive]]
binding = "DB"
id = "21d31839432b41a8b2ca3f808891e04c"

# The office object and the platform object of production (plan E). No MADAR_TEST_TOOLS, no MADAR_DAY_CAP and no MADAR_DATA here.
[[env.production.durable_objects.bindings]]
name = "OFFICE"
class_name = "Office"

[[env.production.durable_objects.bindings]]
name = "PLATFORM"
class_name = "Platform"

# The Cron fan-out (server/enterprise/fanout.ts): this Worker calls itself once for each enterprise. The binding names this env Worker.
[[env.production.services]]
binding = "SELF"
service = "madar-server-production"

[env.production.vars]
SUPABASE_URL = "https://oprkvdjudjxxhvodkzgs.supabase.co"
WORKER_REGION = "workers-eu-central-1"
MADAR_CRON_TRANSPORT = "self"

[env.production.observability]
enabled = true
