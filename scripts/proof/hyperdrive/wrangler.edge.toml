# madar-probe-edge: the front Worker of the Hyperdrive probe (proof.md, "Hyperdrive probe on madar-test (2026-10-16)").
# Deploy after madar-probe: npx wrangler deploy -c scripts/proof/hyperdrive/wrangler.edge.toml (the sandbox must be off).
# No placement: it runs near the caller and calls madar-probe through the service binding.
name = "madar-probe-edge"
main = "edge.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# After the probe run: no public address. Set true only for a new run, then false again.
workers_dev = false
preview_urls = false

[[services]]
binding = "PROBE"
service = "madar-probe"
