query ($acc: String!, $from: Time!, $to: Time!) { viewer { accounts(filter: { accountTag: $acc }) {
  w: workersInvocationsAdaptive(limit: 10, filter: { scriptName: "madar-socket-probe", datetime_geq: $from, datetime_leq: $to }) {
    dimensions { status } sum { requests errors } quantiles { cpuTimeP25 cpuTimeP50 cpuTimeP90 cpuTimeP99 } }
} } }
